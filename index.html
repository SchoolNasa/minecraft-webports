<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SchoolNasa - História</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
    margin: 0;
    font-family: 'Roboto', sans-serif;

    background:
        linear-gradient(
            rgba(2, 0, 120, 0.45),
            rgba(20,0,40,.55)
        ),
        url("background.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: white;
}

    .container{
    max-width:1440px;
    margin:40px auto;

    background:rgba(15,15,20,.70);

    backdrop-filter:blur(12px);

    border:2px solid rgba(180,80,255,.35);

    border-radius:20px;

    box-shadow:
    0 0 30px rgba(120,0,255,.3);
}
    h1, h2, p, h4, h5 {
      text-align: center;
      margin: 10px 0;
    }

    h3{
      text-align: center;
      margin: 0px 0;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #ffd900ce;
      text-shadow: 0 0 10px rgba(70, 156, 0, 0.253);
    }


    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #ffd900ce;
      text-shadow: 0 0 10px rgba(70, 156, 0, 0.253);
    }
    
    h3 {
      font-size: 3rem;
      color: #ffffff;
      text-shadow: 0 0 10px rgb(26, 26, 26);
    }

     h4 {
      font-size: 5rem;
      color: #ff0000;
      text-shadow: 0 0 10px rgb(70, 0, 0);
    }

    h5 {
      font-size: 2rem;
      color: #c9ffd6;
      text-shadow: 0 0 10px rgb(70, 0, 0);
    }

    .game-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* always 3 columns */
      gap: 25px;
      margin-top: 40px;
    }

    .game-buttons button {
      background: rgba(0, 150, 112, 0.2);
      border: 2px solid rgba(0, 255, 136, 0.4);
      border-radius: 15px;
      padding: 20px;
      color: #e0f7ff;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 124, 83, 0.644);
    }

    .game-buttons button:hover {
      transform: translateY(-6px);
      background: rgba(0, 255, 136, 0.671);
      border-color: #00ff6296;
      box-shadow: 0 8px 25px rgba(0,0,80,0.6);
    }

    .game-buttons button img {
      width: 96px;
      height: 96px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 2px solid rgba(100,180,255,0.5);
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #a0cce0;
      background: rgba(0,0,40,0.7);
      backdrop-filter: blur(6px);
      margin-top: auto;
    }
    .logo{
    width:340px;
    display:block;
    margin:auto;
    margin-bottom:0px;
    filter: drop-shadow(0 0 20px #8a2eff);
}
  </style>
</head>
<body>
  <img src="logo.png" class="logo">
<h3>SchoolNasa</h3>
  <div class="container">
    <h4>História</h4>
    <style>
  h5 a {
    color: #00c3ff;
    text-shadow: 0 0 10px rgb(0, 63, 78);
    text-decoration: none;
  }
  h5 a:hover {
    text-shadow: 0 0 20px #00c3ff;
  }
</style>

<h5>O <a href="https://schoolnasa.github.io" target="_blank">SchoolNasa</a> foi um site que teve inicio em 2025 (originalmente um site aleatório sem nome feito para jogar apenas <a href="https://subwaysurfers.com/" target="_blank">Subway Surfers</a>), e depois virou um site de jogos.</h5>
<h5>O personagem presente na logo é <a href="https://fandom.com" target="_blank">Mile</a>, criado pelo Youtuber <a href="https://www.youtube.com/@yellowzin_" target="_blank">Yellowzin_</a></h5>
    

    <div class="game-buttons">
    </div>
  </div>
  <script>
    function openGame(url){
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
